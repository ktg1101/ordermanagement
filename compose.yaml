name: ordermanagement

services:
  postgres:
    image: postgres:17-alpine
    container_name: ordermanagement-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ordermanagement}
      POSTGRES_USER: ${POSTGRES_USER:-akhoa1101-docker}
      # Giá trị mặc định chỉ dành cho máy local. Môi trường thật phải đặt qua .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-QAZOKM}
    ports:
      - "${POSTGRES_PORT:-5431}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ordermanagement:latest
    container_name: ordermanagement-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ordermanagement}
      DB_USERNAME: ${POSTGRES_USER:-akhoa1101-docker}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-QAZOKM}
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ordermanagement-frontend:latest
    container_name: ordermanagement-frontend
    depends_on:
      app:
        condition: service_healthy
    # Mở http://localhost:3000 — nginx phục vụ giao diện và proxy /api, /actuator sang service "app".
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    restart: unless-stopped

volumes:
  postgres-data:
